name: Build and Deploy to AKS

on:
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:

  # Job 1: Code Security Scan
  code-security:
    name: SonarCloud Code Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Java version
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          projectBaseDir: ./app
          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Job 2: Build and Scan Image
  build-and-scan:
    name: Build Docker Image & Trivy Scan
    runs-on: ubuntu-latest
    needs: code-security

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Azure CLI - Log in to ACR
        run: |
          az acr login --name nimbusacrdev001

      - name: Build Docker image
        run: |
          docker build \
            --no-cache \
            -t nimbusacrdev001.azurecr.io/nimbus-app:v1 \
            ./app

      - name: Save Docker image for Trivy
        run: |
          docker save \
            nimbusacrdev001.azurecr.io/nimbus-app:v1 \
            -o nimbus-app.tar

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: nimbus-app.tar
          scan-type: image
          scanners: vuln
          format: table
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Run Trivy full report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: nimbus-app.tar
          scan-type: image
          scanners: vuln
          format: sarif
          output: trivy-results.sarif
          severity: 'CRITICAL,HIGH'

      - name: Push Docker image to ACR
        run: |
          docker push nimbusacrdev001.azurecr.io/nimbus-app:v1

  # Job 3: Deploy to AKS
  deploy:
    name: Deploy to AKS
    runs-on: ubuntu-latest
    needs: build-and-scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS context
        run: |
          az aks get-credentials \
            --resource-group rg-nimbus-dev \
            --name aks-nimbus-dev \
            --overwrite-existing

      - name: Deploy to AKS
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/my-app-deployment -n dev --timeout=5m
          kubectl get pods -n dev
          kubectl get svc -n dev

  # Job 4: Send Success Notification
  notify:
    name: Send Success Notification
    runs-on: ubuntu-latest
    needs: deploy
    if: success()

    steps:
      - name: Send Email Notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "✅ NimbusShop Deployment Successful"
          to: omekeifebuche1@gmail.com
          from: omekeifebuche1@gmail.com
          body: |
            ✅ NimbusShop deployment completed successfully!

            Security Checks:
            🔎 SonarCloud: Passed
            🔍 Trivy Scan: Passed

            Deployment:
            🚀 Image: nimbusacrdev001.azurecr.io/nimbus-app:v1
            ☸️ Cluster: aks-nimbus-dev

            🔗 SonarCloud Dashboard: https://sonarcloud.io/project/overview?id=${{ secrets.SONAR_PROJECT_KEY }}
            🔗 GitHub Actions: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}